name: ci
on:
  pull_request:
  push:
    branches: [ main ]
jobs:
  build-test:
    runs-on: windows-latest   # matches the kiosk target (net10.0-windows later)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore SelfCheckoutKiosk.sln
      - name: Build (strict; warnings are errors via Directory.Build.props)
        run: dotnet build SelfCheckoutKiosk.sln -c Release --no-restore
      - name: Test
        run: dotnet test SelfCheckoutKiosk.sln -c Release --no-build
      # Architecture boundaries are compile-enforced by project references;
      # AOT analyzers run automatically because product projects set IsAotCompatible=true.
